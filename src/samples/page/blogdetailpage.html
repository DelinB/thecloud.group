function useSectionTabMemory() {
  useEffect(() => {
    const tracked = SECTIONS
      .map((s) => ({ ...s, el: document.getElementById(s.id) }))
      .filter((s) => s.el);
    const io = new IntersectionObserver((entries) => {
      const best = entries.filter((e) => e.isIntersecting)
        .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
      if (!best) return;
      const sec = tracked.find((s) => s.el === best.target);
      if (sec) document.title = sec.title + ' — TCG';
    }, { rootMargin: '-25% 0px -55% 0px', threshold: [0, 0.25, 0.5, 1] });
    tracked.forEach((s) => io.observe(s.el));
    return () => io.disconnect();
  }, []);
}

function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('[data-reveal]');
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) { e.target.classList.add('on'); io.unobserve(e.target); }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);
}

function useCountUp(target, duration) {
  const [val, setVal] = useState(0);
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      setVal(target);
      return;
    }
    let raf;
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (!e.isIntersecting) return;
        io.disconnect();
        const t0 = performance.now();
        const tick = (t) => {
          const p = Math.min((t - t0) / duration, 1);
          setVal(Math.round(target * (1 - Math.pow(1 - p, 3))));
          if (p < 1) raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
      });
    }, { threshold: 0.35 });
    io.observe(el);
    return () => { io.disconnect(); if (raf) cancelAnimationFrame(raf); };
  }, [target, duration]);
  return [ref, val];
}

function useScrollSpy(ids) {
  const [active, setActive] = useState(ids[0]);
  useEffect(() => {
    const els = ids.map((id) => document.getElementById(id)).filter(Boolean);
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) setActive(e.target.id); });
    }, { rootMargin: '-20% 0px -70% 0px', threshold: 0 });
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, [ids]);
  return active;
}

function useArticleProgress(ref) {
  const [pct, setPct] = useState(0);
  useEffect(() => {
    const on = () => {
      const el = ref.current;
      if (!el) return;
      const rect = el.getBoundingClientRect();
      const total = rect.height - window.innerHeight;
      if (total <= 0) { setPct(100); return; }
      const scrolled = Math.min(Math.max(-rect.top, 0), total);
      setPct(Math.round((scrolled / total) * 100));
    };
    on();
    window.addEventListener('scroll', on, { passive: true });
    window.addEventListener('resize', on);
    return () => {
      window.removeEventListener('scroll', on);
      window.removeEventListener('resize', on);
    };
  }, [ref]);
  return pct;
}

function ScrollProgress() {
  const [p, setP] = useState(0);
  useEffect(() => {
    const on = () => {
      const h = document.documentElement;
      const max = h.scrollHeight - h.clientHeight;
      setP(max > 0 ? h.scrollTop / max : 0);
    };
    on();
    window.addEventListener('scroll', on, { passive: true });
    return () => window.removeEventListener('scroll', on);
  }, []);
  return (
    <div aria-hidden className="fixed top-0 left-0 right-0 h-[3px] z-[95] origin-left pointer-events-none"
      style={{ background: 'var(--accent)', transform: 'scaleX(' + p + ')' }} />

/* ---------- SHARE ROW ---------- */
function ShareRow() {
  const [copied, setCopied] = useState(false);

  const copy = async () => {
    try {
      await navigator.clipboard.writeText(SHARE_URL);
    } catch (e) {
      var ta = document.createElement('textarea');
      ta.value = SHARE_URL;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e2) {}
      document.body.removeChild(ta);
    }
    setCopied(true);
    setTimeout(function () { setCopied(false); }, 1800);
  };

  const btn = 'w-10 h-10 rounded-full flex items-center justify-center transition-opacity hover:opacity-75';

  return (
    <div className="flex items-center gap-2">
      <span className="t-chip uppercase tracking-wide" style={{ color: 'var(--muted)' }}>Share</span>
      <button type="button" onClick={copy} aria-label="Copy link" className={btn}
        style={{ border: '1px solid var(--border)', background: 'var(--card)' }}>
        <Icon name={copied ? 'check' : 'link'} className="w-4" style={copied ? { color: '#22c55e' } : undefined} />
      </button>
      <a href={'https://twitter.com/intent/tweet?text=' + encodeURIComponent(ARTICLE.title) + '&url=' + encodeURIComponent(SHARE_URL)}
        target="_blank" rel="noreferrer" aria-label="Share on X" className={btn}
        style={{ border: '1px solid var(--border)', background: 'var(--card)' }}>
        <Icon name="xsoc" className="w-4" />
      </a>
      <a href={'https://www.linkedin.com/sharing/share-offsite/?url=' + encodeURIComponent(SHARE_URL)}
        target="_blank" rel="noreferrer" aria-label="Share on LinkedIn" className={btn}
        style={{ border: '1px solid var(--border)', background: 'var(--card)' }}>
        <Icon name="linkedin" className="w-4" />
      </a>
      <a href={'https://wa.me/?text=' + encodeURIComponent(ARTICLE.title + ' ' + SHARE_URL)}
        target="_blank" rel="noreferrer" aria-label="Share on WhatsApp" className={btn}
        style={{ border: '1px solid var(--border)', background: 'var(--card)' }}>
        <Icon name="message" className="w-4" />
      </a>
      {copied && <span className="fade-in t-chip" style={{ color: '#22c55e' }}>Copied</span>}
    </div>
  );
}

        <H2 n="02">Activity is not value</H2>

        </p>
        <p>

          name the cost line that dropped or the revenue line that grew, your AI program is a cost center

        </p>
        <PullQuote>

      </section>

        <p>
          Across the deployments we&rsquo;ve audited, AI reliably pays back in exactly three places:
        </p>
        <ul>
          <li><strong>Cost</strong> &mdash; the unit economics of a repeatable process: cost per resolved ticket, per processed document, per screened CV.</li>
          <li><strong>Revenue</strong> &mdash; conversion lift anywhere AI touches the funnel: recommendations, pricing, lead scoring.</li>
          <li><strong>Risk</strong> &mdash; avoided cost with a defensible estimate: fraud caught, churn prevented, downtime predicted.</li>
        </ul>
        <p>
          The rule of thumb we use in audits: if the metric doesn&rsquo;t have a currency sign &mdash; or a proxy

        <StatRow stats={[

          questions worth asking <em>before</em> a euro is spent:
        </p>
        <ol>
          <li><strong>What decision or process does this change &mdash; specifically?</strong> &ldquo;Make us smarter&rdquo; is not a process.</li>
          <li><strong>What does it cost fully loaded?</strong> Licenses are the small number. Integration, monitoring and the human review layer are the big ones.</li>
          <li><strong>What&rsquo;s the baseline it improves?</strong> If you can&rsquo;t measure today&rsquo;s cost, you can&rsquo;t prove tomorrow&rsquo;s savings.</li>
          <li><strong>Who owns it in month six?</strong> Models drift. Data changes. Someone has to retrain, or the value quietly decays.</li>
        </ol>
        <p>

          <li>Measure the baseline for two weeks <em>before</em> touching a model.</li>

/* ---------- APP ---------- */
function App() {
  const [theme, setTheme] = useState(function () {
    try { return localStorage.getItem('tcg-theme') || 'light'; }
    catch (e) { return 'light'; }
  });

  const bodyRef = useRef(null);
  const pct = useArticleProgress(bodyRef);
  const activeToc = useScrollSpy(TOC_IDS);

  useSectionTabMemory();
  useReveal();

  useEffect(() => {
    document.documentElement.classList.toggle('dark', theme === 'dark');
    try { localStorage.setItem('tcg-theme', theme); } catch (e) {}
    var boot = document.getElementById('boot');
    if (boot) boot.classList.add('hide');
  }, [theme]);

  return (
    <div className="min-h-[100svh]" style={{ background: 'var(--bg)', color: 'var(--fg)' }}>
      <ScrollProgress />
      <Nav theme={theme} setTheme={setTheme} />
      <main className="flex flex-col">
        <ArticleHero />
        <FeaturedVisual />

        <div className="container-x mt-10 md:mt-14 grid grid-cols-1 lg:grid-cols-[240px_minmax(0,1fr)] gap-10 lg:gap-16 pb-14 md:pb-20">
          <TOCSidebar active={activeToc} pct={pct} />
          <ArticleBody bodyRef={bodyRef} />
        </div>

        <TagsRow />
        <AuthorCard />
        <PrevNext />
        <RelatedArticles />
        <Newsletter />
      </main>
      <Footer />
    </div>
  );
}

try {
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
} catch (err) {
  var el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = 'Boot error:\n\n' + (err && err.stack || err);
}
</script>
</body>
</html>
