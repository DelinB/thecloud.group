<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Insights — TCG</title>

<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>

<style>
@font-face {
  font-display: swap;
  font-family: 'codec-pro';
  font-style: normal;
  font-weight: 400;
  src: url('https://storage.googleapis.com/download/storage/v1/b/prd-storytodesign.appspot.com/o/h2d-ext-asset%2F73ed8859cfe61a80695ca501ed94529112bbb4e4.woff2?generation=1790060408823232&alt=media') format('woff2');
}

:root {
  --bg: rgb(246 246 246);
  --fg: #000000;
  --muted: #5c5c5c;
  --card: #ffffff;
  --border: rgba(0, 0, 0, 0.08);
  --accent: rgb(225 252 6);
}
.dark {
  --bg: #0a0a0a;
  --fg: #f5f5f5;
  --muted: #a3a3a3;
  --card: #161616;
  --border: rgba(255, 255, 255, 0.10);
}

* { -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; padding: 0; overflow-x: hidden; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'codec-pro', system-ui, -apple-system, sans-serif;
  transition: background-color .35s ease, color .35s ease;
  -webkit-font-smoothing: antialiased;
}
#root { min-height: 100%; }
section[id] { scroll-margin-top: 96px; }

::selection { background: var(--accent); color: #000; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(128,128,128,.25); border-radius: 9999px; }

.t-hero    { font-size: clamp(2.2rem, 7.5vw, 6.2rem); line-height: .95; letter-spacing: -.045em; font-weight: 400; }
.t-h2      { font-size: clamp(2rem, 6vw, 5.5rem); line-height: 1; letter-spacing: -.05em; font-weight: 400; }
.t-h2-sm   { font-size: clamp(1.75rem, 4.2vw, 3.7rem); line-height: 1.02; letter-spacing: -.04em; font-weight: 400; }
.t-h3      { font-size: clamp(1.15rem, 1.8vw, 1.5rem); line-height: 1.1; letter-spacing: -.02em; font-weight: 400; }
.t-stat    { font-size: clamp(3rem, 6vw, 5.5rem); line-height: 1; letter-spacing: -.05em; font-weight: 400; }
.t-body    { font-size: clamp(.92rem, 1.05vw, 1.05rem); line-height: 1.55; }
.t-small   { font-size: clamp(.78rem, .9vw, .88rem); line-height: 1.5; }
.t-chip    { font-size: clamp(.75rem, .85vw, .86rem); line-height: 1.4; }

.container-x { width: 100%; max-width: 1280px; margin-inline: auto; padding-inline: 20px; }
@media (min-width: 640px)  { .container-x { padding-inline: 28px; } }
@media (min-width: 1024px) { .container-x { padding-inline: 46px; } }

/* ---------- MARQUEE ---------- */
@keyframes marquee {
  from { transform: translate3d(0, 0, 0); }
  to   { transform: translate3d(-50%, 0, 0); }
}
.marquee-mask {
  overflow: hidden;
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 6%, #000 94%, transparent 100%);
          mask-image: linear-gradient(to right, transparent 0, #000 6%, #000 94%, transparent 100%);
}
.marquee-track {
  display: flex;
  align-items: center;
  gap: clamp(14px, 2vw, 28px);
  width: max-content;
  animation: marquee var(--marquee-dur, 60s) linear infinite;
}
.marquee-track.slow { --marquee-dur: 120s; }
.marquee-track:hover { animation-play-state: paused; }

/* ---------- SCROLL REVEAL ---------- */
[data-reveal] {
  opacity: 0;
  transform: translateY(26px);
  transition: opacity .7s cubic-bezier(.22,1,.36,1), transform .7s cubic-bezier(.22,1,.36,1);
  transition-delay: var(--d, 0ms);
}
[data-reveal].on { opacity: 1; transform: none; }

/* ---------- CARD ENTRANCE (re-plays on category switch) ---------- */
@keyframes cardUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
.card-in { animation: cardUp .55s cubic-bezier(.22,1,.36,1) both; animation-delay: calc(var(--i, 0) * 60ms); }

/* ---------- TEXT WIPE HIGHLIGHT ---------- */
.hl-wipe {
  background: var(--accent); color: #000;
  padding: .02em .14em;
  clip-path: inset(0 100% 0 0);
  transition: clip-path .9s cubic-bezier(.22,1,.36,1) .45s;
}
[data-reveal].on .hl-wipe { clip-path: inset(0 -0.1em 0 0); }

/* ---------- ARTICLE CARDS ---------- */
.art-card { transition: transform .25s ease, border-color .25s ease, box-shadow .3s ease; }
.art-card:hover { transform: translateY(-5px); border-color: var(--c); box-shadow: 0 26px 60px -28px var(--c); }
.uc-ghost { position: absolute; right: -14px; bottom: -18px; opacity: .06; pointer-events: none; transition: opacity .3s ease, transform .45s ease; }
.art-card:hover .uc-ghost { opacity: .13; transform: translateY(-5px) rotate(-5deg); }

/* ---------- NAV UNDERLINE ---------- */
.nav-link { position: relative; }
.nav-link::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -5px; height: 1.5px;
  background: var(--fg); transform: scaleX(0); transform-origin: left; transition: transform .25s ease;
}
.nav-link:hover::after { transform: scaleX(1); }

.chip {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 32px; padding: 0 14px;
  border-radius: 9999px;
  white-space: nowrap;
  background: var(--card);
  color: var(--fg);
}

.btn-primary {
  display: inline-flex; align-items: center; justify-content: center; gap: 18px;
  height: 52px; padding: 4px 6px 4px 24px;
  border-radius: 9999px;
  background: var(--fg); color: var(--bg);
  font-size: .92rem; line-height: 1.4;
  transition: transform .18s ease, opacity .18s ease;
}
.btn-primary:hover { transform: translateY(-1px); opacity: .92; }
.btn-primary .btn-icon {
  width: 40px; height: 40px; border-radius: 9999px;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent); color: #000;
}
.btn-accent {
  display: inline-flex; align-items: center; justify-content: center; gap: 18px;
  height: 52px; padding: 4px 6px 4px 24px;
  border-radius: 9999px;
  background: var(--accent); color: #000;
  font-size: .92rem; line-height: 1.4;
  transition: transform .18s ease, opacity .18s ease;
}
.btn-accent:hover { transform: translateY(-1px); opacity: .92; }
.btn-accent .btn-icon {
  width: 40px; height: 40px; border-radius: 9999px;
  display: flex; align-items: center; justify-content: center;
  background: #fff; color: #000;
}
.btn-sub {
  display: inline-flex; align-items: center; justify-content: center;
  height: 52px; padding: 0 28px;
  border-radius: 9999px;
  background: var(--accent); color: #000;
  font-size: .92rem; line-height: 1.4;
  transition: transform .18s ease, opacity .18s ease;
  white-space: nowrap;
}
.btn-sub:hover { transform: translateY(-1px); opacity: .9; }

.btn-ghost {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  height: 52px; padding: 0 26px;
  border-radius: 9999px;
  border: 1px solid var(--border);
  background: var(--card); color: var(--fg);
  font-size: .92rem; line-height: 1.4;
  transition: border-color .18s ease, transform .18s ease;
}
.btn-ghost:hover { border-color: var(--fg); transform: translateY(-1px); }

.link-arrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: .95rem;
  border-bottom: 1px solid var(--fg);
  padding-bottom: 2px;
  transition: gap .2s ease, opacity .2s ease;
}
.link-arrow:hover { gap: 14px; opacity: .75; }

.field {
  width: 100%; height: 52px;
  border-radius: 9999px;
  padding: 0 18px;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--fg);
  font-family: inherit;
  font-size: .95rem;
}
.field::placeholder { color: var(--muted); }
.field:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.field.pad-l { padding-left: 46px; }
.field.pad-r { padding-right: 46px; }

.no-scrollbar { scrollbar-width: none; }
.no-scrollbar::-webkit-scrollbar { display: none; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.fade-in { animation: fadeUp .5s ease both; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
.bob { animation: bob 2s ease-in-out infinite; }
@keyframes pop { 0% { transform: scale(.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.pop { animation: pop .3s cubic-bezier(.22,1,.36,1) both; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

@media (prefers-reduced-motion: reduce) {
  .marquee-track { animation: none; }
  [data-reveal] { opacity: 1 !important; transform: none !important; transition: none !important; }
  .hl-wipe { clip-path: none !important; }
  .card-in { animation: none !important; }
  .bob, .pop { animation: none !important; }
}

#boot {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: var(--bg); color: var(--fg); z-index: 999999;
  font-family: 'codec-pro', system-ui, sans-serif;
  transition: opacity .4s ease;
}
#boot.hide { opacity: 0; pointer-events: none; }
#boot .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display:inline-block; margin: 0 4px; animation: pulse 1.2s infinite; }
#boot .dot:nth-child(2){ animation-delay: .15s; }
#boot .dot:nth-child(3){ animation-delay: .3s; }
@keyframes pulse { 0%,100%{ transform: scale(.6); opacity:.4;} 50%{ transform: scale(1); opacity:1;} }
#err {
  position: fixed; inset: 0; z-index: 9999999;
  background: #1a0000; color: #ff9e9e;
  padding: 24px; overflow: auto;
  font-family: ui-monospace, Menlo, monospace; font-size: 13px; line-height: 1.6;
  white-space: pre-wrap; display: none;
}
</style>
</head>

<body>
<div id="boot"><div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>
<div id="root"></div>
<pre id="err"></pre>

<script>
window.addEventListener('error', function (e) {
  var el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = 'Runtime error:\n\n' + (e.error && e.error.stack || e.message) +
    (e.filename ? '\n\nAt: ' + e.filename + ':' + e.lineno : '');
});
</script>

<script type="text/babel" data-presets="react" data-type="module">
const { useState, useEffect, useRef } = React;

/* ---------- ICONS ---------- */
const ICONS = {
  arrow:   <path d="M5 12h14M13 6l6 6-6 6" />,
  check:   <path d="M20 6L9 17l-5-5" />,
  x:       <path d="M18 6L6 18M6 6l12 12" />,
  search:  <path d="M11 19a8 8 0 100-16 8 8 0 000 16zM21 21l-4.35-4.35" />,
  mail:    <path d="M4 4h16a2 2 0 012 2v12a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2zM22 6l-10 7L2 6" />,
  spark:   <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3zM19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15z" />,
  compass: <path d="M12 22a10 10 0 100-20 10 10 0 000 20zM16.2 7.8l-2.1 6.3-6.3 2.1 2.1-6.3 6.3-2.1z" />,
  filecheck:<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8zM14 2v6h6M9 15l2 2 4-4" />,
  chart:   <path d="M3 3v18h18M7 14l4-4 3 3 5-6" />,
  code:    <path d="M16 18l6-6-6-6M8 6l-6 6 6 6" />,
  pen:     <path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z" />,
  clock:   <path d="M12 22a10 10 0 100-20 10 10 0 000 20zM12 6v6l4 2" />
};
function Icon({ name, className, style }) {
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"
      strokeLinecap="round" strokeLinejoin="round" className={className} style={style} aria-hidden="true">
      {ICONS[name]}
    </svg>
  );
}

/* ---------- SECTION TAB MEMORY ---------- */
const SECTIONS = [
  { id: 'hero',      title: 'Insights' },
  { id: 'featured',  title: 'Featured Article' },
  { id: 'articles',  title: 'All Articles' },
  { id: 'subscribe', title: 'Newsletter' },
  { id: 'contact',   title: 'Talk to Us' }
];
function useSectionTabMemory() {
  useEffect(() => {
    const tracked = SECTIONS
      .map((s) => ({ ...s, el: document.getElementById(s.id) }))
      .filter((s) => s.el);
    const io = new IntersectionObserver((entries) => {
      const best = entries.filter((e) => e.isIntersecting)
        .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
      if (!best) return;
      const sec = tracked.find((s) => s.el === best.target);
      if (sec) document.title = sec.title + ' — TCG';
    }, { rootMargin: '-25% 0px -55% 0px', threshold: [0, 0.25, 0.5, 1] });
    tracked.forEach((s) => io.observe(s.el));
    return () => io.disconnect();
  }, []);
}

/* ---------- SCROLL REVEAL ---------- */
function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('[data-reveal]');
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) { e.target.classList.add('on'); io.unobserve(e.target); }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);
}

/* ---------- COUNT-UP (featured 88%) ---------- */
function useCountUp(target, duration) {
  const [val, setVal] = useState(0);
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      setVal(target);
      return;
    }
    let raf;
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (!e.isIntersecting) return;
        io.disconnect();
        const t0 = performance.now();
        const tick = (t) => {
          const p = Math.min((t - t0) / duration, 1);
          setVal(Math.round(target * (1 - Math.pow(1 - p, 3))));
          if (p < 1) raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
      });
    }, { threshold: 0.35 });
    io.observe(el);
    return () => { io.disconnect(); if (raf) cancelAnimationFrame(raf); };
  }, [target, duration]);
  return [ref, val];
}

/* ---------- SCROLL PROGRESS BAR ---------- */
function ScrollProgress() {
  const [p, setP] = useState(0);
  useEffect(() => {
    const on = () => {
      const h = document.documentElement;
      const max = h.scrollHeight - h.clientHeight;
      setP(max > 0 ? h.scrollTop / max : 0);
    };
    on();
    window.addEventListener('scroll', on, { passive: true });
    return () => window.removeEventListener('scroll', on);
  }, []);
  return (
    <div aria-hidden className="fixed top-0 left-0 right-0 h-[3px] z-[95] origin-left pointer-events-none"
      style={{ background: 'var(--accent)', transform: 'scaleX(' + p + ')' }} />
  );
}

/* ---------- NAV ---------- */
const NAV_LINKS = [
  { label: 'Home',       href: 'index.html' },
  { label: 'Featured',   href: '#featured' },
  { label: 'All articles', href: '#articles' },
  { label: 'Newsletter', href: '#subscribe' }
];

function Nav({ theme, setTheme }) {
  const [open, setOpen] = useState(false);
  const [scrolled, setScrolled] = useState(false);

  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 20);
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  useEffect(() => {
    document.body.style.overflow = open ? 'hidden' : '';
    return () => { document.body.style.overflow = ''; };
  }, [open]);

  return (
    <React.Fragment>
      <header className={'fixed top-0 inset-x-0 z-[90] transition-colors duration-300 ' +
        (scrolled ? 'backdrop-blur-md bg-black/5 border-b border-[color:var(--border)]' : '')}>
        <div className="container-x flex items-center justify-between h-[60px] md:h-[72px]">
          <div className="flex items-center gap-5">
            <a href="index.html" className="flex items-center gap-2.5 text-[13px] md:text-[14px]">
              <span className="w-7 h-7 rounded-lg flex items-center justify-center font-bold text-[13px]"
                style={{ background: 'var(--fg)', color: 'var(--bg)' }}>T</span>
              <span>TCG</span>
            </a>
            <span className="hidden sm:inline t-chip px-3 py-1 rounded-full" style={{ background: 'var(--accent)', color: '#000' }}>
              Insights
            </span>
          </div>

          <ul className="hidden lg:flex items-center gap-6 text-[13px] md:text-[14px]">
            {NAV_LINKS.map((l) => (
              <li key={l.label}>
                <a href={l.href} className="nav-link inline-flex items-center gap-1.5 opacity-80 hover:opacity-100 transition-opacity">
                  {l.label}
                </a>
              </li>
            ))}
          </ul>

          <div className="flex items-center gap-2 sm:gap-3">
            <div className="relative flex items-center h-9 sm:h-10 rounded-full p-1" style={{ background: 'var(--fg)', color: 'var(--bg)' }}>
              <button
                onClick={() => setTheme('light')}
                aria-label="Light mode"
                className="relative z-10 px-3 sm:px-4 h-full text-[12px] sm:text-[13px] rounded-full"
                style={{ color: theme === 'light' ? 'var(--fg)' : 'rgba(0,0,0,.55)' }}
              >Light</button>
              <button
                onClick={() => setTheme('dark')}
                aria-label="Dark mode"
                className="relative z-10 px-3 sm:px-4 h-full text-[12px] sm:text-[13px] rounded-full"
                style={{ color: theme === 'dark' ? 'var(--fg)' : 'rgba(255,255,255,.6)' }}
              >Dark</button>
              <span
                className="absolute top-1 bottom-1 w-[calc(50%-4px)] rounded-full transition-all duration-300 ease-out"
                style={{ background: 'var(--bg)', left: theme === 'light' ? '4px' : 'calc(50% + 0px)' }}
              />
            </div>

            <a href="index.html#contact" className="hidden sm:inline-flex items-center gap-3 h-10 md:h-11 pl-4 md:pl-5 pr-1 rounded-full text-[13px] md:text-[14px]"
              style={{ background: 'var(--fg)', color: 'var(--bg)' }}>
              Free consultation
              <span className="w-8 h-8 md:w-9 md:h-9 rounded-full flex items-center justify-center text-black" style={{ background: 'var(--accent)' }}>
                <Icon name="arrow" className="w-3.5" />
              </span>
            </a>

            <button
              onClick={() => setOpen(!open)}
              aria-label="Menu"
              className="lg:hidden w-10 h-10 flex flex-col items-center justify-center gap-1.5 rounded-full border"
              style={{ borderColor: 'var(--border)' }}
            >
              <span className={'block w-4 h-[1.5px] transition-transform ' + (open ? 'translate-y-[6px] rotate-45' : '')} style={{ background: 'currentColor' }} />
              <span className={'block w-4 h-[1.5px] transition-opacity ' + (open ? 'opacity-0' : '')} style={{ background: 'currentColor' }} />
              <span className={'block w-4 h-[1.5px] transition-transform ' + (open ? '-translate-y-[6px] -rotate-45' : '')} style={{ background: 'currentColor' }} />
            </button>
          </div>
        </div>
      </header>

      <div className={'fixed inset-0 z-[89] lg:hidden transition-opacity duration-300 ' + (open ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none')}>
        <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setOpen(false)} />
        <nav className={'absolute top-[60px] inset-x-0 border-b p-6 pt-4 transition-transform duration-300 ' + (open ? 'translate-y-0' : '-translate-y-4')}
          style={{ background: 'var(--bg)', borderColor: 'var(--border)' }}>
          <ul className="flex flex-col gap-1">
            {NAV_LINKS.map((l) => (
              <li key={l.label}>
                <a href={l.href} onClick={() => setOpen(false)} className="block py-3 text-2xl border-b" style={{ borderColor: 'var(--border)' }}>{l.label}</a>
              </li>
            ))}
          </ul>
          <a href="index.html#contact" onClick={() => setOpen(false)} className="mt-6 flex items-center justify-between h-12 pl-5 pr-1 rounded-full"
            style={{ background: 'var(--fg)', color: 'var(--bg)' }}>
            Free consultation
            <span className="w-10 h-10 rounded-full flex items-center justify-center text-black" style={{ background: 'var(--accent)' }}>
              <Icon name="arrow" className="w-4" />
            </span>
          </a>
        </nav>
      </div>
    </React.Fragment>
  );
}

/* ---------- SECTION 1: HERO (search + newsletter) ---------- */
function Hero({ query, setQuery }) {
  const [subscribed, setSubscribed] = useState(false);

  const submitSearch = (e) => {
    e.preventDefault();
    const el = document.getElementById('articles');
    if (el) el.scrollIntoView({ behavior: 'smooth' });
  };

  return (
    <section id="hero" className="relative w-full flex flex-col justify-center pt-32 pb-16 md:pt-40 md:pb-20 overflow-hidden" style={{ minHeight: '100svh' }}>
      <div aria-hidden className="absolute -z-10 top-0 right-0 w-[60vw] md:w-[40vw] aspect-square rounded-full blur-3xl opacity-50"
        style={{ background: 'radial-gradient(circle, rgb(225,252,6) 20%, transparent 70%)' }} />

function Articles({ query, setQuery, category, setCategory }) {
  const q = query.trim().toLowerCase();
  const filtered = ARTICLES.filter((a) => {
    const matchesQ = !q || [a.title, a.excerpt, a.author, a.category].join(' ').toLowerCase().includes(q);
    const matchesC = category === 'All' || a.category === category;
    return matchesQ && matchesC;
  });

  const pill = (name) => {
    const active = category === name;
    const count = name === 'All' ? ARTICLES.length : ARTICLES.filter((a) => a.category === name).length;
    return (
      <button key={name} type="button" onClick={() => setCategory(name)} aria-pressed={active}
        className={'shrink-0 h-9 px-4 rounded-full t-chip whitespace-nowrap transition-opacity ' + (active ? '' : 'hover:opacity-70')}
        style={active ? { background: 'var(--fg)', color: 'var(--bg)' } : { color: 'var(--fg)' }}>
        {name}
        <span className="hidden sm:inline opacity-60 ml-1.5">{count}</span>
      </button>
    );
  };

  return (
    <section id="articles" className="relative w-full z-[1] pt-2 pb-14 md:pb-20">
      {/* Sticky filter capsule */}
      <div className="sticky top-[70px] md:top-[84px] z-40 py-3">
        <div className="container-x">
          <div className="no-scrollbar overflow-x-auto rounded-full flex items-center gap-1 p-1.5 shadow-sm"
            style={{ background: 'var(--card)', border: '1px solid var(--border)' }}>
            {pill('All')}
            {CATEGORIES.map((c) => pill(c.name))}
            <span className="ml-auto shrink-0 t-chip pr-3 hidden md:flex" style={{ color: 'var(--muted)' }}>
              {filtered.length} article{filtered.length === 1 ? '' : 's'}
            </span>
          </div>
        </div>
      </div>

      <div className="container-x mt-8">
        {/* key on category only: switching replays the stagger; typing updates in place */}
        <div key={category} className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 md:gap-4">
          {filtered.map((a, i) => <ArticleCard key={a.id} a={a} i={i} />)}

          {filtered.length === 0 && (
            <div className="card-in col-span-full flex flex-col items-center gap-4 py-20 text-center" style={{ '--i': 0 }}>
              <Icon name="search" className="w-10 h-10" style={{ color: 'var(--muted)' }} />
              <p className="t-h3">Nothing matches{q ? ' \u201C' + query.trim() + '\u201D' : ''}.</p>
              <p className="t-small" style={{ color: 'var(--muted)' }}>Try different keywords, or reset the filters.</p>
              <button type="button" onClick={() => { setQuery(''); setCategory('All'); }} className="btn-ghost">
