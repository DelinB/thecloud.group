    <!--
      Inline boot styles. These paint before any CSS bundle loads,
      so the boot splash is styled from the very first frame.
    -->
    <style>
      :root {
        --boot-bg: #f6f6f6;
        --boot-fg: #1c1608;
        --boot-accent: #E5B32B;
      }
      html.dark {
        --boot-bg: #12100b;
        --boot-fg: #ede4d0;
      }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--boot-bg);
      }

      /* Boot splash — covers everything until React mounts */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: var(--boot-bg);
        transition: opacity 320ms ease;
        opacity: 1;
      }
      #boot-splash[data-done="true"] {
        opacity: 0;
        pointer-events: none;
      }

      .boot-mark {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        font-family: system-ui, -apple-system, sans-serif;
        color: var(--boot-fg);
      }
      .boot-mark img {
        height: 44px;
        width: auto;
      }
      .boot-bar {
        width: 120px;
        height: 2px;
        background: color-mix(in srgb, var(--boot-fg) 12%, transparent);
        overflow: hidden;
        border-radius: 999px;
      }
      .boot-bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        background: var(--boot-accent);
        border-radius: 999px;
        animation: boot-slide 1.1s cubic-bezier(.4,0,.2,1) infinite;
      }
      @keyframes boot-slide {
        0%   { transform: translateX(-120%); }
        100% { transform: translateX(280%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar::after { animation: none; width: 100%; }
      }

      /*
        Hide the SEO fallback off-screen.
        It stays in the DOM (crawlers read it) but sighted users never see it.
        React's createRoot() wipes #root on mount, removing it entirely.
      */
      [data-seo-fallback] {
        position: absolute !important;
        left: -9999px !important;
        top: auto !important;
        width: 1px !important;
        height: 1px !important;
        overflow: hidden !important;
        clip: rect(0 0 0 0) !important;
        white-space: nowrap !important;
      }
    </style>
  </head>
  <body>
    <!-- Branded boot splash — visible until React mounts -->
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-mark">
        <img src="/image.png" alt="" />
        <div class="boot-bar"></div>
      </div>
    </div>

    <!-- React mounts here. Fallback content goes inside, wrapped in
         [data-seo-fallback] by scripts/prerender-seo.js. -->
    <div id="root"></div>
